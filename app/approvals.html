<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimbursr (BETA) - Finance Review Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-main">Reimbursr<div class="beta-badge">BETA</div></div>
        <div class="logo-reflection">Reimbursr</div>
      </div>
      <nav>
        <a href="index.html" class="nav-tab">Employee Portal</a>
        <a href="approvals.html" class="nav-tab active">Finance Review</a>
      </nav>
    </header>

    <!-- Running Totals Dashboard -->
    <div class="totals-container">
      <div class="total-item">
        <div class="total-label">Total Approved Spent</div>
        <div id="total-approved" class="total-value approved-spent">$0.00</div>
      </div>
      <div class="total-item">
        <div class="total-label">Total Pending Review</div>
        <div id="total-pending" class="total-value pending-spent">$0.00</div>
      </div>
    </div>

    <!-- Review Section -->
    <div class="card">
      <div class="card-header">
        Expense Claims Review Console
      </div>
      <div class="card-body">
        <!-- Filters Row -->
        <div class="filter-bar">
          <button id="filter-all" class="btn-filter active">All Claims</button>
          <button id="filter-pending" class="btn-filter">Pending Approval</button>
          <button id="filter-approved" class="btn-filter">Approved</button>
          <button id="filter-rejected" class="btn-filter">Rejected</button>
        </div>

        <div class="table-responsive">
          <table class="table-web2">
            <thead>
              <tr>
                <th>Date</th>
                <th>Employee</th>
                <th>Category</th>
                <th>Description</th>
                <th>Amount</th>
                <th>Status</th>
                <th>Notes / Actions</th>
              </tr>
            </thead>
            <tbody id="approvals-list-body">
              <!-- Rendered dynamically -->
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>

  <!-- Rejection Dialog Overlay -->
  <div id="rejection-dialog" class="dialog-overlay">
    <div class="dialog">
      <div class="dialog-header">
        Provide Rejection Reason
      </div>
      <div class="dialog-body">
        <form id="rejection-form">
          <input type="hidden" id="reject-expense-id">
          <div class="form-group">
            <label for="reject-notes">Reason for Rejection</label>
            <textarea id="reject-notes" class="form-control" rows="4" placeholder="Enter details on why this expense claim is being rejected..."></textarea>
          </div>
        </form>
      </div>
      <div class="dialog-footer">
        <button id="btn-cancel-reject" class="btn btn-filter">Cancel</button>
        <button id="btn-confirm-reject" class="btn btn-danger">Confirm Rejection</button>
      </div>
    </div>
  </div>

  <script type="module" src="js/approvals.js"></script>
</body>
</html>
