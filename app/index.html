<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reimbursr (BETA) - Employee Portal</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-main">Reimbursr<div class="beta-badge">BETA</div></div>
        <div class="logo-reflection">Reimbursr</div>
      </div>
      <nav>
        <a href="index.html" class="nav-tab active">Employee Portal</a>
        <a href="approvals.html" class="nav-tab">Finance Review</a>
      </nav>
    </header>

    <!-- Running Totals Dashboard -->
    <div class="totals-container">
      <div class="total-item">
        <div class="total-label">Total Approved Spent</div>
        <div id="total-approved" class="total-value approved-spent">$0.00</div>
      </div>
      <div class="total-item">
        <div class="total-label">Total Pending Review</div>
        <div id="total-pending" class="total-value pending-spent">$0.00</div>
      </div>
    </div>

    <div class="dashboard-grid">
      <!-- Submit Expense Card -->
      <div class="card">
        <div class="card-header">
          Submit Out-of-Pocket Expense
        </div>
        <div class="card-body">
          <div id="validation-error-alert" class="alert alert-danger" style="display: none;"></div>
          <div id="submission-success-alert" class="alert alert-success" style="display: none;"></div>

          <form id="expense-form" novalidate>
            <div class="form-group">
              <label for="employeeName">Employee Name *</label>
              <input type="text" id="employeeName" class="form-control" placeholder="e.g. Jane Smith">
            </div>

            <div class="form-group">
              <label for="category">Category *</label>
              <select id="category" class="form-control">
                <option value="" disabled selected>-- Select Expense Category --</option>
                <option value="Travel">Travel</option>
                <option value="Meals">Meals</option>
                <option value="Lodging">Lodging</option>
                <option value="Supplies">Supplies</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group">
              <label for="expenseDate">Expense Date *</label>
              <input type="date" id="expenseDate" class="form-control">
            </div>

            <div class="form-group">
              <label for="amount">Amount ($) *</label>
              <input type="number" id="amount" class="form-control" step="0.01" min="0.01" placeholder="0.00">
            </div>

            <div class="form-group">
              <label for="description">Description *</label>
              <textarea id="description" class="form-control" rows="3" placeholder="Provide details regarding the out-of-pocket expense..."></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Expense Claim</button>
          </form>
        </div>
      </div>

      <!-- Employee Expense Tracker Card -->
      <div class="card">
        <div class="card-header">
          My Submitted Expense Claims
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table-web2">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Employee</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th>Amount</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="expense-list-body">
                <!-- Rendered dynamically -->
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
